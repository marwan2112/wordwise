<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="WordWise - حكمة الكلمات">
    <title>WordWise - حكمة الكلمات</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="wordwise_logo.png">
    <link rel="apple-touch-icon" href="wordwise_logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script type="module">
        // استيراد الدوال المطلوبة من Firebase CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut, 
            updateProfile 
        } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc, 
            updateDoc, 
            collection 
        } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyCfzRIaQoZCgzeyubsY1Ta-uZBk3x1skqs",
            authDomain: "wordwise-97d44.firebaseapp.com",
            projectId: "wordwise-97d44",
            storageBucket: "wordwise-97d44.firebasestorage.app",
            messagingSenderId: "388003307189",
            appId: "1:388003307189:web:5d13e92d274b437b4c28fc",
            measurementId: "G-J3BKL29S7H"
        };

        // تشغيل Firebase
        const firebaseApp = initializeApp(firebaseConfig);
        
        // تصدير المتغيرات والدوال لـ Window لكي يراها ملف app.js العادي
        window.auth = getAuth(firebaseApp);
        window.db = getFirestore(firebaseApp);
        
        // تصدير الدوال التي يستخدمها كود app.js الخاص بك
        window.onAuthStateChanged = onAuthStateChanged;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signOut = signOut;
        window.setDoc = setDoc;
        window.doc = doc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;

        console.log("✅ Firebase System Initialized");

        /** * تحميل ملفات المشروع برمجياً لضمان عدم تشغيل app.js 
         * إلا بعد أن يصبح Firebase جاهزاً تماماً في المتصفح
         */
        const projectScripts = ["data.js", "gapfillDB.js", "app.js"];
        
        projectScripts.forEach(src => {
            const script = document.createElement('script');
            script.src = src;
            script.async = false; // التحميل بالترتيب المذكور أعلاه
            document.body.appendChild(script);
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('🚀 Service Worker: Active'))
                    .catch(err => console.error('❌ Service Worker: Failed', err));
            });
        }
    </script>
</body>
</html>
